<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <link rel="canonical" href="https://www.towerbridge.org.uk/bridge-lifts">
    <title>Tower Bridge Lift times - Tower Bridge</title>
</head>
<body>
<main class="main" id="main-content">
    <div class="page-header page-header--royal">
        <h1 class="page-heading">Bridge Lifts</h1>
    </div>

    <form method="get" action="/bridge-lifts">
        <div class="bridge-filters">
            <div class="container">
                <div class="grid flex flex--wrap">
                    <div class="grid__item a4-12 f6-6">
                        <div class="form__set">
                            <label class="form__label" for="filtered_date">Jump to date</label>
                            <div class="form__select-container">
                                <select class="form__select filter__load-more-input" id="filtered_date" name="filtered_date">
                                    <option value="" selected>Select</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="grid__item a4-12 f6-6 bridge-filters__results-count">
                        <button id="filter__apply-button" type="submit">Apply</button>
                        <div id="result_count" class="removed">
                            <p class="filters__results-count">0 results</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>

    <div id="load-more-results">
    </div>

    <div id="pagination-container" class="mb-16">
        <div class="pagination" data-pagination data-pagination-load-more-receptacle="#load-more-results">
            <ul class="pagination__links"><li><span>1</span></li></ul>
        </div>
    </div>
</main>
</body>
</html>
